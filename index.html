<!DOCTYPE html>
<html lang="ms" data-theme="dark" data-lang="ms">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Semak Nombor Kaunter</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --mono:'DM Mono',monospace;
  --radius:18px; --radius-sm:12px;
  --ease:.28s cubic-bezier(.4,0,.2,1);
  /* Sheet accent colors — vivid, work in both themes */
  --bsr-h:#3b82f6; --bsr-d:rgba(59,130,246,.18); --bsr-b:rgba(59,130,246,.35);
  --bmr-h:#a855f7; --bmr-d:rgba(168,85,247,.18); --bmr-b:rgba(168,85,247,.35);
  --bbr-h:#10b981; --bbr-d:rgba(16,185,129,.18); --bbr-b:rgba(16,185,129,.35);
  --green:#10b981; --red:#ef4444; --yellow:#f59e0b;
  --sheet-h:var(--bsr-h); --sheet-d:var(--bsr-d); --sheet-b:var(--bsr-b);
}
[data-theme="dark"]{
  --bg:#07090e; --bg2:#0b0f1a;
  --card:#111827; --surface:#0f172a;
  --border:#1e293b; --border2:#253247;
  --text:#f1f5f9; --text2:#94a3b8; --text3:#475569;
  --shadow:rgba(0,0,0,.7);
  --glow:rgba(59,130,246,.12);
}
[data-theme="light"]{
  --bg:#f0f4ff; --bg2:#e8eeff;
  --card:#ffffff; --surface:#f8faff;
  --border:#dde4f5; --border2:#c5d0e8;
  --text:#0f172a; --text2:#334155; --text3:#64748b;
  --shadow:rgba(15,23,42,.1);
  --glow:rgba(59,130,246,.07);
}
/* Sheet active color switching */
[data-sheet="BSR"]{--sheet-h:var(--bsr-h);--sheet-d:var(--bsr-d);--sheet-b:var(--bsr-b);}
[data-sheet="BMR"]{--sheet-h:var(--bmr-h);--sheet-d:var(--bmr-d);--sheet-b:var(--bmr-b);}
[data-sheet="BBR"]{--sheet-h:var(--bbr-h);--sheet-d:var(--bbr-d);--sheet-b:var(--bbr-b);}

body{
  background:var(--bg); color:var(--text);
  font-family:'DM Sans',sans-serif; min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:28px 18px 52px;
  transition:background var(--ease),color var(--ease);
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(ellipse 80% 50% at 50% -10%,var(--glow),transparent 65%);
}

/* ── TOPBAR ── */
.topbar{
  width:100%; max-width:500px;
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:28px; position:relative; z-index:10;
  animation:fadeDown .4s ease both;
}
.lang-row{display:flex;gap:3px;background:var(--card);border:1px solid var(--border);border-radius:99px;padding:3px;box-shadow:0 2px 10px var(--shadow);}
.lb{border:none;background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;padding:5px 10px;border-radius:99px;cursor:pointer;transition:all var(--ease);}
.lb:hover{color:var(--text2);}
.lb.on{background:#2563eb;color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.4);}
.theme-btn{width:38px;height:38px;border:1px solid var(--border);border-radius:50%;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all var(--ease);box-shadow:0 2px 10px var(--shadow);}
.theme-btn:hover{border-color:#2563eb;transform:rotate(15deg);}

/* ── WRAPPER ── */
.wrap{width:100%;max-width:500px;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;animation:fadeUp .5s .05s ease both;}

/* ── LOGO ── */
.logo-box{
  width:82px;height:82px;border-radius:22px;
  background:var(--card);border:2px dashed var(--border2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  margin-bottom:22px;position:relative;overflow:hidden;
  transition:all var(--ease);
}
.logo-box::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(59,130,246,.07),transparent);}
.logo-box span{font-size:28px;line-height:1;}
.logo-box small{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);}

/* ── HEADER ── */
.hdr{text-align:center;margin-bottom:24px;}
.badge-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.25);color:#60a5fa;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 14px;border-radius:99px;margin-bottom:14px;}
.pulse{width:6px;height:6px;border-radius:50%;background:#3b82f6;animation:pulse 2s infinite;}
h1{font-size:clamp(23px,5vw,34px);font-weight:800;letter-spacing:-.04em;line-height:1.15;color:var(--text);transition:color var(--ease);}
h1 em{font-style:normal;color:#60a5fa;}
.sub{margin-top:9px;color:var(--text2);font-size:13px;line-height:1.6;transition:color var(--ease);}

/* ── CARD ── */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:22px;
  padding:28px;width:100%;
  box-shadow:0 20px 60px var(--shadow),0 0 0 1px rgba(255,255,255,.02);
  transition:background var(--ease),border-color var(--ease);
}
.flabel{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;transition:color var(--ease);}
.inp-wrap{position:relative;margin-bottom:13px;}
.inp-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;}
input[type=text]{
  width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:14px 14px 14px 44px;font-family:var(--mono);font-size:15px;color:var(--text);
  letter-spacing:.06em;outline:none;
  transition:border-color var(--ease),box-shadow var(--ease),background var(--ease);
}
input::placeholder{color:var(--text3);}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15);}

/* ── SEARCH BUTTON ── */
.search-btn{
  width:100%;background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;
  border:none;border-radius:var(--radius-sm);padding:14px;
  font-family:'DM Sans',sans-serif;font-size:14.5px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:opacity .2s,transform .15s;box-shadow:0 4px 18px rgba(37,99,235,.4);
}
.search-btn:hover{opacity:.9;}
.search-btn:active{transform:scale(.98);}
.search-btn:disabled{opacity:.4;cursor:not-allowed;}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spinning .7s linear infinite;display:none;}
.search-btn.loading .spin{display:block;}
.search-btn.loading .btn-txt{display:none;}

/* ── RESULT ── */
#result{margin-top:22px;display:none;animation:fadeUp .35s ease both;}

/* Result header row */
.res-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.sheet-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 14px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.08em;
}
.sheet-badge.BSR{background:rgba(59,130,246,.18);color:#93c5fd;border:1px solid rgba(59,130,246,.35);}
.sheet-badge.BMR{background:rgba(168,85,247,.18);color:#d8b4fe;border:1px solid rgba(168,85,247,.35);}
.sheet-badge.BBR{background:rgba(16,185,129,.18);color:#6ee7b7;border:1px solid rgba(16,185,129,.35);}
[data-theme="light"] .sheet-badge.BSR{background:#2563eb;color:#fff;border-color:#2563eb;}
[data-theme="light"] .sheet-badge.BMR{background:#7c3aed;color:#fff;border-color:#7c3aed;}
[data-theme="light"] .sheet-badge.BBR{background:#059669;color:#fff;border-color:#059669;}

.found-tag{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;}
.found-tag.ok{color:var(--green);}
.found-tag.err{color:var(--red);}

/* Nama block */
.res-nama{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.03em;margin-bottom:4px;}
.res-ic{font-family:var(--mono);font-size:14px;color:var(--text);font-weight:600;letter-spacing:.08em;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;display:inline-block;margin-bottom:16px;}

/* ── SINGLE KAUNTER BOX ── */
.kaunter-solo{
  background:linear-gradient(135deg,var(--sheet-d),transparent 70%);
  border:1px solid var(--sheet-b);border-radius:16px;padding:20px;
  text-align:center;margin-bottom:14px;position:relative;overflow:hidden;
}
.kaunter-solo::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:var(--sheet-d);}
.k-lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sheet-h);margin-bottom:4px;opacity:.8;}
.k-num{font-family:var(--mono);font-size:52px;font-weight:700;color:var(--sheet-h);line-height:1;}
[data-theme="light"] .k-num{color:var(--sheet-h);}

/* ── MULTI KAUNTER GRID ── */
.multi-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;text-align:center;}
.kaunter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
.kaunter-card{
  background:var(--surface);border:2px solid var(--sheet-b);border-radius:14px;
  padding:16px 14px;text-align:center;transition:all var(--ease);
}
.kaunter-card:hover{transform:translateY(-2px);border-color:var(--sheet-h);}
.kc-badge{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sheet-h);margin-bottom:6px;}
.kc-num{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--sheet-h);line-height:1;margin-bottom:10px;}
.kc-row{font-size:11.5px;color:var(--text2);line-height:1.7;}
.kc-row strong{color:var(--text);font-weight:600;}

/* Info rows */
.info-grid{display:grid;gap:7px;margin-bottom:14px;}
.info-row{
  display:flex;flex-direction:column;gap:3px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;
  transition:background var(--ease),border-color var(--ease);
}
.ik{color:var(--text3);font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;}
.iv{font-family:var(--mono);font-size:13px;color:var(--text);font-weight:700;word-break:break-word;line-height:1.35;}

/* ── KEHADIRAN SECTION ── */
.keh-section{border-top:1px solid var(--border);padding-top:18px;margin-top:4px;}

/* ── MULTI-SHEET GROUPS ── */
.sheet-group{margin-bottom:18px;border-radius:18px;overflow:hidden;border:1px solid var(--border);transition:border-color var(--ease);}
.sheet-group-header{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:10px 14px;
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  flex-wrap:wrap;
}
.sheet-group.BSR .sheet-group-header{background:rgba(59,130,246,.12);color:#93c5fd;border-bottom:1px solid rgba(59,130,246,.2);}
.sheet-group.BMR .sheet-group-header{background:rgba(168,85,247,.12);color:#d8b4fe;border-bottom:1px solid rgba(168,85,247,.2);}
.sheet-group.BBR .sheet-group-header{background:rgba(16,185,129,.12);color:#6ee7b7;border-bottom:1px solid rgba(16,185,129,.2);}
[data-theme="light"] .sheet-group.BSR .sheet-group-header{background:rgba(37,99,235,.1);color:#1d4ed8;}
[data-theme="light"] .sheet-group.BMR .sheet-group-header{background:rgba(124,58,237,.1);color:#6d28d9;}
[data-theme="light"] .sheet-group.BBR .sheet-group-header{background:rgba(5,150,105,.1);color:#047857;}
.sheet-group-body{padding:14px;display:grid;gap:10px;}
.match-card{
  background:var(--surface);border-radius:12px;
  border:1px solid var(--border);
  transition:all var(--ease);position:relative;
  overflow:hidden;
  display:flex;flex-direction:column;
}
.mc-main{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 14px 14px 18px;
}
.match-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:2px 0 0 0;}
.sheet-group.BSR .match-card::before{background:var(--bsr-h);}
.sheet-group.BMR .match-card::before{background:var(--bmr-h);}
.sheet-group.BBR .match-card::before{background:var(--bbr-h);}
.match-card:hover{border-color:var(--border2);}
.mc-kaunter{text-align:center;flex-shrink:0;width:64px;}
.mc-k-lbl{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;}
.sheet-group.BSR .mc-k-lbl{color:var(--bsr-h);}
.sheet-group.BMR .mc-k-lbl{color:var(--bmr-h);}
.sheet-group.BBR .mc-k-lbl{color:var(--bbr-h);}
/* Brighter, clearer counter number — pill + glow */
.mc-k-num{
  font-family:var(--mono);font-size:34px;font-weight:700;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;
  min-width:54px;padding:6px 10px;border-radius:12px;
  background:var(--sheet-d);border:1.5px solid var(--sheet-b);
}
.sheet-group.BSR .mc-k-num{color:#bfdbfe;background:rgba(59,130,246,.16);border-color:rgba(59,130,246,.45);text-shadow:0 0 18px rgba(59,130,246,.55);}
.sheet-group.BMR .mc-k-num{color:#e9d5ff;background:rgba(168,85,247,.16);border-color:rgba(168,85,247,.45);text-shadow:0 0 18px rgba(168,85,247,.55);}
.sheet-group.BBR .mc-k-num{color:#a7f3d0;background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.45);text-shadow:0 0 18px rgba(16,185,129,.55);}
[data-theme="light"] .sheet-group.BSR .mc-k-num{color:#1d4ed8;text-shadow:none;}
[data-theme="light"] .sheet-group.BMR .mc-k-num{color:#7c3aed;text-shadow:none;}
[data-theme="light"] .sheet-group.BBR .mc-k-num{color:#047857;text-shadow:none;}
.mc-divider{width:1px;align-self:stretch;min-height:32px;background:var(--border);flex-shrink:0;}
.mc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
/* Each info row: label on top, value below — stacks cleanly on any width */
.mc-info-row{display:flex;flex-direction:column;gap:2px;}
.mc-info-row .mk{
  color:var(--text3);font-size:10px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;line-height:1;
}
.mc-info-row .mv{
  color:var(--text);font-weight:700;font-size:13px;
  line-height:1.35;word-break:break-word;white-space:normal;
}
.mc-status{flex-shrink:0;display:flex;align-items:flex-start;padding-top:2px;}
.mc-hadir{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(16,185,129,.15);font-size:13px;}
.mc-tidak{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(245,158,11,.1);font-size:13px;}
/* Terima bantuan status strip */
.mc-terima-strip{
  display:flex;align-items:center;gap:7px;
  padding:8px 16px;
  border-top:1px solid var(--border);
  font-size:11.5px;font-weight:600;
}
.mc-terima-strip.received{
  background:rgba(139,92,246,.08);color:#c4b5fd;
  border-top-color:rgba(139,92,246,.2);
}
.mc-terima-strip.pending{
  background:rgba(100,116,139,.05);color:var(--text3);
  border-top-color:var(--border);
}
[data-theme="light"] .mc-terima-strip.received{background:rgba(109,40,217,.07);color:#6d28d9;border-top-color:rgba(109,40,217,.2);}
.mc-terima-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.mc-terima-strip.received .mc-terima-dot{background:#a78bfa;}
.mc-terima-strip.pending .mc-terima-dot{background:var(--border2);}

/* ── SESI BADGE (Pagi / Petang) ── */
.mc-sesi{
  display:inline-flex;align-items:center;gap:5px;align-self:flex-start;
  padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;
  letter-spacing:.05em;margin-top:2px;
}
.mc-sesi.pagi{background:rgba(245,158,11,.14);color:#fbbf24;border:1px solid rgba(245,158,11,.32);}
.mc-sesi.petang{background:rgba(99,102,241,.14);color:#a5b4fc;border:1px solid rgba(99,102,241,.32);}
[data-theme="light"] .mc-sesi.pagi{background:rgba(217,119,6,.1);color:#b45309;}
[data-theme="light"] .mc-sesi.petang{background:rgba(79,70,229,.1);color:#4338ca;}

/* ── TERIMA BUTTON (per kaunter, terima-link mode only) ── */
.mc-terima-action{
  display:flex;align-items:center;gap:7px;padding:10px 14px;
  border-top:1px solid var(--border);
}
.btn-terima-card{
  flex:1;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;
  border:none;border-radius:10px;padding:11px;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  transition:opacity .2s,transform .15s;box-shadow:0 3px 12px rgba(124,58,237,.35);
}
.btn-terima-card:hover{opacity:.9;}
.btn-terima-card:active{transform:scale(.98);}
.btn-terima-card:disabled{opacity:.5;cursor:not-allowed;}
.mc-terima-locked{
  display:flex;align-items:center;gap:7px;padding:9px 14px;
  border-top:1px solid var(--border);
  font-size:11.5px;font-weight:600;color:var(--text3);
  background:rgba(100,116,139,.05);
}

/* Summary bar */
.result-summary{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:11px 16px;margin-bottom:16px;
  font-size:12.5px;flex-wrap:wrap;gap:8px;
}
.rs-count{font-weight:700;color:var(--text);}
.rs-count span{color:var(--sheet-h);}
.rs-sheets{display:flex;gap:6px;}
.rs-sheet-tag{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:99px;}
.rs-sheet-tag.BSR{background:rgba(59,130,246,.15);color:#93c5fd;}
.rs-sheet-tag.BMR{background:rgba(168,85,247,.15);color:#d8b4fe;}
.rs-sheet-tag.BBR{background:rgba(16,185,129,.15);color:#6ee7b7;}
[data-theme="light"] .rs-sheet-tag.BSR{background:#2563eb;color:#fff;}
[data-theme="light"] .rs-sheet-tag.BMR{background:#7c3aed;color:#fff;}
[data-theme="light"] .rs-sheet-tag.BBR{background:#059669;color:#fff;}
.keh-title{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);text-align:center;margin-bottom:10px;}
.keh-q{font-size:14.5px;font-weight:600;color:var(--text);text-align:center;margin-bottom:14px;line-height:1.5;}
.keh-btns{display:flex;gap:9px;}
.btn-ya{
  flex:1;background:linear-gradient(135deg,#059669,#047857);color:#fff;
  border:none;border-radius:var(--radius-sm);padding:13px;
  font-family:'DM Sans',sans-serif;font-size:14.5px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  transition:opacity .2s,transform .15s;box-shadow:0 4px 14px rgba(5,150,105,.35);
}
.btn-ya:hover{opacity:.9;}
.btn-ya:active{transform:scale(.97);}
.btn-ya:disabled{opacity:.4;cursor:not-allowed;}
.btn-tidak{
  flex:1;background:var(--surface);color:var(--text2);
  border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px;
  font-family:'DM Sans',sans-serif;font-size:14.5px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  transition:all .2s;
}
.btn-tidak:hover{border-color:var(--red);color:var(--red);}
.sudah-hadir{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.28);
  border-radius:12px;padding:14px;color:#34d399;font-weight:700;font-size:14px;
}
.keh-msg{margin-top:10px;border-radius:10px;padding:12px 14px;font-size:13px;font-weight:600;text-align:center;}
.keh-msg.ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:#6ee7b7;}
.keh-msg.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.22);color:#fca5a5;}

/* Error box */
.err-box{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.22);border-radius:12px;padding:15px;font-size:13.5px;color:#fca5a5;line-height:1.5;}

/* ── FOOTER ── */
.footer{margin-top:24px;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:14px;animation:fadeUp .5s .2s ease both;}
.footer-link{display:flex;align-items:center;gap:5px;color:var(--text3);text-decoration:none;font-weight:600;letter-spacing:.04em;transition:color var(--ease);}
.footer-link:hover{color:#3b82f6;}
.fdot{width:4px;height:4px;border-radius:50%;background:var(--text3);}

/* ── ANIMATIONS ── */
/* ── CAMERA BUTTON & QR BUTTONS ── */
/* mc-cams removed — QR now uses static URL approach */

/* ── TERIMA MODE BANNER ── */
.terima-banner{
  background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(99,102,241,.1));
  border:1px solid rgba(139,92,246,.35);border-radius:14px;
  padding:14px 18px;margin-bottom:20px;
  display:flex;align-items:center;gap:12px;
}
.terima-banner-icon{font-size:24px;flex-shrink:0;}
.terima-banner-text{}
.terima-banner-title{font-size:14px;font-weight:700;color:#c4b5fd;margin-bottom:2px;}
.terima-banner-sub{font-size:12px;color:var(--text2);}
[data-theme="light"] .terima-banner{background:rgba(109,40,217,.07);border-color:rgba(109,40,217,.3);}
[data-theme="light"] .terima-banner-title{color:#6d28d9;}

/* ── MODAL OVERLAY ── */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;animation:fadeUp .2s ease both;
}
[data-theme="light"] .modal-overlay{background:rgba(15,23,42,.5);}

/* ── JUMLAH MODAL ── */
.jumlah-modal-box{
  background:var(--card);border:1px solid var(--border);border-radius:24px;
  width:100%;max-width:340px;padding:32px 28px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.jumlah-icon-big{font-size:44px;margin-bottom:14px;line-height:1;}
.jumlah-title{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.03em;margin-bottom:6px;line-height:1.35;}
.jumlah-sub{font-size:12px;color:var(--text3);margin-bottom:24px;}
.jumlah-counter{
  display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:16px;
}
.jcnt-btn{
  width:44px;height:44px;border-radius:50%;border:2px solid var(--border);
  background:var(--surface);color:var(--text);font-size:22px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;line-height:1;
}
.jcnt-btn:hover{border-color:#2563eb;color:#60a5fa;background:rgba(37,99,235,.1);}
.jcnt-btn:disabled{opacity:.25;cursor:not-allowed;}
.jcnt-num{
  font-family:'DM Mono',monospace;font-size:52px;font-weight:700;
  color:#60a5fa;line-height:1;min-width:60px;
  transition:all .15s;
}
[data-theme="light"] .jcnt-num{color:#2563eb;}
.jumlah-dots{display:flex;gap:8px;justify-content:center;margin-bottom:24px;}
.jdot{
  width:10px;height:10px;border-radius:50%;
  background:var(--border);transition:all .2s;
}
.jdot.on{background:#3b82f6;transform:scale(1.2);}
.jumlah-submit{
  width:100%;background:linear-gradient(135deg,#2563eb,#1e40af);
  color:#fff;border:none;border-radius:14px;padding:14px;
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;
  cursor:pointer;margin-bottom:10px;
  box-shadow:0 4px 18px rgba(37,99,235,.4);transition:opacity .2s,transform .15s;
}
.jumlah-submit:hover{opacity:.9;}
.jumlah-submit:active{transform:scale(.98);}
.jumlah-skip{
  background:none;border:none;color:var(--text3);
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;padding:6px;transition:color .2s;
}
.jumlah-skip:hover{color:var(--text2);}
.jumlah-result{margin-top:14px;border-radius:10px;padding:11px;font-size:13px;font-weight:600;}
.jumlah-result.ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:#6ee7b7;}
.jumlah-result.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#fca5a5;}

/* ── CONFIRM TERIMA MODAL ── */
.confirm-box{
  background:var(--card);border:1px solid var(--border);border-radius:24px;
  width:100%;max-width:360px;padding:30px 26px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.confirm-icon{font-size:42px;margin-bottom:12px;line-height:1;}
.confirm-title{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.03em;margin-bottom:6px;line-height:1.35;}
.confirm-sub{font-size:12.5px;color:var(--text2);margin-bottom:22px;line-height:1.5;}
.confirm-sub b{color:var(--text);font-weight:700;}
.confirm-btns{display:flex;gap:10px;}
.confirm-ya{
  flex:1;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;border:none;
  border-radius:13px;padding:13px;font-family:'DM Sans',sans-serif;font-size:14.5px;font-weight:700;
  cursor:pointer;transition:opacity .2s,transform .15s;box-shadow:0 4px 16px rgba(124,58,237,.4);
}
.confirm-ya:hover{opacity:.9;} .confirm-ya:active{transform:scale(.98);}
.confirm-ya:disabled{opacity:.5;cursor:not-allowed;}
.confirm-tidak{
  flex:1;background:var(--surface);color:var(--text2);border:1.5px solid var(--border);
  border-radius:13px;padding:13px;font-family:'DM Sans',sans-serif;font-size:14.5px;font-weight:600;
  cursor:pointer;transition:all .2s;
}
.confirm-tidak:hover{border-color:var(--red);color:var(--red);}
.confirm-result{margin-top:14px;border-radius:10px;padding:11px;font-size:13px;font-weight:600;}
.confirm-result.ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:#6ee7b7;}
.confirm-result.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#fca5a5;}

/* ── QR COPY TOAST ── */
.qr-toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#1e293b;border:1px solid #334155;color:#e2e8f0;
  padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;
  z-index:300;pointer-events:none;
  animation:toastIn .3s ease both;
}
@keyframes qrPulse{0%,100%{box-shadow:0 0 0 1000px rgba(0,0,0,.35),0 0 0 0 rgba(59,130,246,.4)}50%{box-shadow:0 0 0 1000px rgba(0,0,0,.35),0 0 0 6px rgba(59,130,246,.1)}}
@keyframes scanLine{0%{top:20%}50%{top:78%}100%{top:20%}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── MOBILE RESPONSIVE ── */
@media (max-width: 480px) {
  body { padding: 20px 14px 40px; }
  .topbar { margin-bottom: 20px; }
  .logo-box { width: 70px; height: 70px; border-radius: 18px; }
  .logo-box span { font-size: 24px; }
  h1 { font-size: 22px; }
  .card { padding: 20px 16px; }
  .res-nama { font-size: 18px; }
  .res-ic { font-size: 12px; padding: 5px 10px; }
  /* match-card: tighter on small screens */
  .mc-main { padding: 12px 12px 12px 16px; gap: 10px; }
  .mc-kaunter { width: 54px; }
  .mc-k-num { font-size: 26px; min-width:46px; padding:5px 8px; }
  .mc-k-lbl { font-size: 7px; }
  .mc-info-row .mv { font-size: 12px; }
  .mc-terima-strip { padding: 7px 12px; font-size: 11px; }
  /* Buttons stack on very small screens */
  .keh-btns { flex-direction: column; gap: 8px; }
  .btn-ya, .btn-tidak { width: 100%; }
  /* Sheet group */
  .sheet-group-body { padding: 10px; }
  .sheet-group-header { padding: 9px 12px; font-size: 10px; }
  /* Footer */
  .footer { flex-wrap: wrap; gap: 10px; justify-content: center; }
  /* Lang switcher */
  .lb { padding: 4px 8px; font-size: 10px; }
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes spinning{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
</style>

let lang = 'ms';
let isDark = true;
let _lastResult = null;

// ── LANG ──
function setLang(l, btn) {
  lang = l;
  document.documentElement.setAttribute('data-lang', l);
  document.querySelectorAll('.lb').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  applyI18n();
  if (_lastResult) _lastResult.success ? showSuccess(_lastResult) : showError(_lastResult.message);
}
function applyI18n() {
  const t = i18n[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => { const k=el.getAttribute('data-i18n'); if(t[k]!==undefined) el.textContent=t[k]; });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { const k=el.getAttribute('data-i18n-html'); if(t[k]!==undefined) el.innerHTML=t[k]; });
  document.getElementById('icInput').placeholder = t.ph;
}

// ── THEME ──
function toggleTheme() {
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
}

// ── IC FORMAT ──
const ic = document.getElementById('icInput');
ic.addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
ic.addEventListener('input', () => {
  let v = ic.value.replace(/[^0-9]/g,'');
  if(v.length>6) v=v.slice(0,6)+'-'+v.slice(6);
  if(v.length>9) v=v.slice(0,9)+'-'+v.slice(9);
  if(v.length>14) v=v.slice(0,14);
  ic.value = v;
});

// ── JSONP (robust: unique name, timer cleanup, single-fire) ──
let _jsonpSeq = 0;
function jsonp(url, cb, timeoutMs) {
  const name = 'cb_' + Date.now() + '_' + (++_jsonpSeq);
  const s = document.createElement('script');
  let done = false, timer = null;
  const finish = (err, d) => {
    if (done) return;
    done = true;
    if (timer) clearTimeout(timer);
    try { delete window[name]; } catch(e) { window[name] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);
    cb(err, d);
  };
  window[name] = d => finish(null, d);
  s.onerror   = () => finish(new Error('network'));
  timer = setTimeout(() => finish(new Error('timeout')), timeoutMs || 7000);
  s.src = url + '&callback=' + name + '&_=' + Date.now(); // cache-bust avoids stale first hit
  document.body.appendChild(s);
}

// ── SEARCH ──
function doSearch() {
  const val = ic.value.trim();
  const t   = i18n[lang];
  if (!val) { showError(t.errEmpty); return; }
  setLoading(true);
  document.getElementById('result').style.display = 'none';
  const url = `${APPS_SCRIPT_URL}?action=search&ic=${encodeURIComponent(val)}`;
  const maxTries = 2;
  let attempt = 0;
  const attemptSearch = () => {
    attempt++;
    jsonp(url, (err, data) => {
      // Large sheets + cold start can take several seconds; retry once if it truly fails
      if ((err || !data) && attempt < maxTries) {
        setTimeout(attemptSearch, 400);
        return;
      }
      setLoading(false);
      _lastResult = data;
      if (err || !data) { showError(t.errServer); return; }
      if (data.success) showSuccess(data);
      else showError(data.message || t.foundErr);
    }, 15000);
  };
  attemptSearch();
}
function setLoading(on) {
  const btn = document.getElementById('searchBtn');
  btn.disabled = on;
  btn.classList.toggle('loading', on);
}

// ── SHOW SUCCESS ──
function showSuccess(d) {
  const t   = i18n[lang];
  const el  = document.getElementById('result');
  const allHadir  = d.allHadir;
  const totalCount = d.matches.length;
  const sheetList  = d.sheets || [d.matches[0].sheet];

  // Use first sheet found as the base colour (or remove data-sheet if multi-sheet)
  if (sheetList.length === 1) el.setAttribute('data-sheet', sheetList[0]);
  else el.removeAttribute('data-sheet');

  // ── Sheet badges row ──
  const sheetBadgesHTML = sheetList.map(s =>
    `<span class="sheet-badge ${s}">📋 ${s}</span>`
  ).join('');

  // ── Summary bar ──
  const sheetTagsHTML = sheetList.map(s =>
    `<span class="rs-sheet-tag ${s}">${s}</span>`
  ).join('');
  const summaryHTML = `
    <div class="result-summary">
      <span class="rs-count">${esc(t.multiLabel.replace('{n}', String(totalCount)))}</span>
      <span class="rs-sheets">${sheetTagsHTML}</span>
    </div>`;

  // ── Sheet groups ──
  const groups = d.sheetGroups || (() => {
    const g = {};
    for (const m of d.matches) { if (!g[m.sheet]) g[m.sheet] = []; g[m.sheet].push(m); }
    return g;
  })();

  const groupsHTML = Object.entries(groups).map(([sheetName, matches]) => {
    const matchCards = matches.map(m => {
      const cardId = ('mc_' + m.sheet + '_' + m.row).replace(/[^a-zA-Z0-9_]/g, '_');

      // Sesi badge (1=Pagi, 2=Petang)
      let sesiHTML = '';
      if (m.sesi !== undefined && m.sesi !== null && String(m.sesi).trim() !== '') {
        const sv = String(m.sesi).trim().toLowerCase();
        const sCls = (sv === '2' || sv.indexOf('petang') > -1) ? 'petang'
                   : (sv === '1' || sv.indexOf('pagi')   > -1) ? 'pagi' : '';
        const sTxt = sCls === 'petang' ? t.sesiPetang : (sCls === 'pagi' ? t.sesiPagi : esc(m.sesi));
        const sTime = sCls === 'pagi' ? '9.00-11.00 pagi' : (sCls === 'petang' ? '2.00 petang' : '');
        if (sCls) sesiHTML = `<span class="mc-sesi ${sCls}">🕒 ${esc(t.sesiLbl)}: ${esc(sTxt)}${sTime ? ' · ' + esc(sTime) : ''}</span>`;
      }

      // Card footer — depends on mode
      let footerHTML;
      if (_terimaMode) {
        // Terima-link mode: show action button / received / locked
        if (m.sudahTerima) {
          footerHTML = `<div class="mc-terima-strip received"><span class="mc-terima-dot"></span><span>${esc(t.statusTerima)}</span></div>`;
        } else if (m.sudahHadir) {
          footerHTML = `<div class="mc-terima-action">
            <button class="btn-terima-card"
              onclick="openTerimaConfirm('${esc(m.sheet)}',${Number(m.row)||0},'${esc(m.ic)}','${esc(m.kaunter||'')}','${cardId}')">
              ${esc(t.btnTerimaCard)}
            </button>
          </div>`;
        } else {
          footerHTML = `<div class="mc-terima-locked">🔒 ${esc(t.terimaLocked)}</div>`;
        }
      } else {
        // Normal mode: status strip only (info, no button)
        footerHTML = `<div class="mc-terima-strip ${m.sudahTerima ? 'received' : 'pending'}">
          <span class="mc-terima-dot"></span>
          ${m.sudahTerima ? `<span>${esc(t.statusTerima)}</span>` : `<span>${esc(t.statusBelumTerima)}</span>`}
        </div>`;
      }

      return `
      <div class="match-card" id="${cardId}">
        <div class="mc-main">
          <div class="mc-kaunter">
            <div class="mc-k-lbl">${esc(t.keyKaunter)}</div>
            <div class="mc-k-num">${esc(m.kaunter||'—')}</div>
          </div>
          <div class="mc-divider"></div>
          <div class="mc-info">
            <div class="mc-info-row"><span class="mk">${esc(t.keyNoSiri)}</span><span class="mv">${esc(m.siri||'—')}</span></div>
            <div class="mc-info-row"><span class="mk">${esc(t.keyBantuan)}</span><span class="mv">${esc(m.bantuan||'—')}</span></div>
            ${sesiHTML}
          </div>
          <div class="mc-status">
            ${m.sudahHadir
              ? `<div class="mc-hadir" title="${esc(t.statusHadir)}">✅</div>`
              : `<div class="mc-tidak" title="${esc(t.statusTidak)}">⏳</div>`}
          </div>
        </div>
        ${footerHTML}
      </div>`;
    }).join('');

    return `
      <div class="sheet-group ${sheetName}">
        <div class="sheet-group-header">
          <span>📋 ${sheetName}</span>
          <span style="opacity:.7;font-weight:500">${matches.length} ${matches.length === 1 ? esc(t.keyKaunter) : esc(t.keyKaunter)}</span>
        </div>
        <div class="sheet-group-body">${matchCards}</div>
      </div>`;
  }).join('');

  // ── Kehadiran section ──
  let kehHTML = '';
  if (allHadir) {
    kehHTML = `<div class="sudah-hadir">${esc(t.sudahHadir)}</div>`;
  } else {
    // Build entries JSON for multi-sheet rekod
    const entries = JSON.stringify(d.matches.map(m => ({sheet: m.sheet, row: m.row})));
    kehHTML = `
      <div class="keh-q">${esc(t.kehQ)}</div>
      <div class="keh-btns" id="kehBtns">
        <button class="btn-ya" id="btnYa" onclick="rekodMulti(this)"
          data-entries='${entries.replace(/'/g,"&#39;")}'>${esc(t.btnYa)}</button>
        <button class="btn-tidak" onclick="batalKeh()">${esc(t.btnTidak)}</button>
      </div>
      <div class="keh-msg" id="kehMsg" style="display:none;"></div>`;
  }

  el.innerHTML = `
    <div class="res-header">
      <div style="display:flex;gap:6px;flex-wrap:wrap;">${sheetBadgesHTML}</div>
      <span class="found-tag ok">✓ ${esc(t.foundOk)}</span>
    </div>
    <div class="res-nama">${esc(d.nama)}</div>
    <div class="res-ic">${esc(d.ic)}</div>
    ${totalCount > 1 ? summaryHTML : ''}
    ${groupsHTML}
    <div class="keh-section">
      <div class="keh-title">${esc(t.kehTitle)}</div>
      ${kehHTML}
    </div>`;

  el.style.display = 'block';
}

// ── SHOW ERROR ──
function showError(msg) {
  const t  = i18n[lang];
  const el = document.getElementById('result');
  el.innerHTML = `
    <div class="res-header">
      <span class="found-tag err">✕ ${esc(t.foundErr)}</span>
    </div>
    <div class="err-box">${esc(msg)}</div>`;
  el.style.display = 'block';
  el.removeAttribute('data-sheet');
}

// ── REKOD KEHADIRAN (multi-sheet aware) ──
function rekodMulti(btn) {
  const t     = i18n[lang];
  const entries = btn ? btn.getAttribute('data-entries') : '[]';
  const btns  = document.getElementById('kehBtns');
  if (btn) btn.disabled = true;
  jsonp(
    `${APPS_SCRIPT_URL}?action=rekodmulti&entries=${encodeURIComponent(entries)}`,
    (err, data) => {
      const msg = document.getElementById('kehMsg');
      if (err || !data) {
        if (msg) { msg.className='keh-msg err'; msg.textContent=t.recodErr; msg.style.display='block'; }
        return;
      }
      if (msg) {
        msg.className = data.success ? 'keh-msg ok' : 'keh-msg err';
        msg.textContent = data.success ? t.recodOk : (data.message || t.recodErr);
        msg.style.display = 'block';
      }
      if (data.success && btns) {
        btns.innerHTML = `<div class="sudah-hadir">${esc(t.sudahHadir)}</div>`;
        // After attendance is confirmed, ask for total attendees
        if (_lastResult && _lastResult.matches && _lastResult.matches.length) {
          const first = _lastResult.matches[0];
          setTimeout(() => openJumlah(first.sheet, first.row, first.ic), 600);
        }
      }
    }
  );
}

function batalKeh() {
  const s = document.querySelector('.keh-section');
  if (s) s.style.display = 'none';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

applyI18n();

function showTerimaBanner() {

  if (existing) existing.remove();

// ── CONFIRM TERIMA BANTUAN (validation popup → record one counter) ──
let _terimaTarget = null; // { sheet, row, ic, cardId }

function openTerimaConfirm(sheet, row, ic, kaunter, cardId) {
  const t = i18n[lang];
  _terimaTarget = { sheet, row: parseInt(row, 10), ic, cardId };
  document.getElementById('terimaQTitle').textContent   = t.terimaQTitle;
  document.getElementById('terimaQSub').innerHTML        = t.terimaQSub.replace('{k}', esc(kaunter || '—'));
  document.getElementById('terimaQYa').textContent       = t.terimaYa;
  document.getElementById('terimaQTidak').textContent    = t.terimaTidak;
  const yaBtn = document.getElementById('terimaQYa');
  yaBtn.disabled = false;
  document.getElementById('terimaQResult').style.display = 'none';
  document.getElementById('terimaQBtns').style.display   = 'flex';
  document.getElementById('terimaConfirmModal').style.display = 'flex';
}

function closeTerimaConfirm() {
  document.getElementById('terimaConfirmModal').style.display = 'none';
  _terimaTarget = null;
}

function submitTerimaConfirm() {
  if (!_terimaTarget) return;
  const t   = i18n[lang];
  const yaBtn = document.getElementById('terimaQYa');
  yaBtn.disabled = true;
  yaBtn.textContent = '⏳';
  const { sheet, row, ic, cardId } = _terimaTarget;
  jsonp(
    `${APPS_SCRIPT_URL}?action=rekodterimaIC&sheet=${encodeURIComponent(sheet)}&row=${row}&ic=${encodeURIComponent(ic)}`,
    (err, res) => {
      const resultEl = document.getElementById('terimaQResult');
      resultEl.style.display = 'block';
      if (err || !res || (!res.success && !res.alreadyDone)) {
        resultEl.className   = 'confirm-result err';
        resultEl.textContent = (res && res.message) ? res.message : t.terimaErr;
        yaBtn.disabled = false;
        yaBtn.textContent = t.terimaYa;
        return;
      }
      // Success or already recorded → mark card as received
      resultEl.className   = 'confirm-result ok';
      resultEl.textContent = t.terimaDone;
      document.getElementById('terimaQBtns').style.display = 'none';
      markCardReceived(cardId);
      // Reflect in cached result so re-render keeps state
      if (_lastResult && _lastResult.matches) {
        const rec = _lastResult.matches.find(m => m.sheet === sheet && parseInt(m.row,10) === row);
        if (rec) { rec.terima = 'Ya'; rec.sudahTerima = true; }
      }
      setTimeout(closeTerimaConfirm, 1500);
    }
  );
}

function markCardReceived(cardId) {
  const t = i18n[lang];
  const card = document.getElementById(cardId);
  if (!card) return;
  const footer = card.querySelector('.mc-terima-action, .mc-terima-locked, .mc-terima-strip');
  if (footer) {
    footer.className = 'mc-terima-strip received';
    footer.innerHTML = '<span class="mc-terima-dot"></span><span>' + esc(t.statusTerima) + '</span>';
  }
}

let _jumlahTarget = null;  // { sheet, row, ic }
let _jumlahVal    = 1;     // termasuk diri sendiri → minimum 1

function openJumlah(sheet, row, ic) {

  _jumlahVal    = 1;
  const t = i18n[lang];
  document.getElementById('jumlahTitle').textContent      = t.jumlahTitle;

  document.getElementById('jumlahResult').style.display   = 'none';
  document.getElementById('jumlahSubmitBtn').style.display = 'block';
  document.getElementById('jumlahSkipBtn').style.display   = 'block';
  updateJumlahDisplay();
  document.getElementById('jumlahModal').style.display = 'flex';
}

function closeJumlah() {
  document.getElementById('jumlahModal').style.display = 'none';
  _jumlahTarget = null;
}

function skipJumlah() { closeJumlah(); }

function jumlahAdj(delta) {
  _jumlahVal = Math.max(1, Math.min(5, _jumlahVal + delta));
  updateJumlahDisplay();
}

function updateJumlahDisplay() {
  document.getElementById('jumlahNum').textContent = _jumlahVal;
  document.getElementById('jMinus').disabled = _jumlahVal <= 1;
  document.getElementById('jPlus').disabled  = _jumlahVal >= 5;
  // Update dots (1..5)
  const dotsEl = document.getElementById('jumlahDots');
  dotsEl.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const d = document.createElement('div');
    d.className = 'jdot' + (i <= _jumlahVal ? ' on' : '');
    dotsEl.appendChild(d);
  }
  // Animate number
  const numEl = document.getElementById('jumlahNum');
  numEl.style.transform = 'scale(1.15)';
  setTimeout(() => { numEl.style.transform = 'scale(1)'; }, 120);
}

function submitJumlah() {
  if (!_jumlahTarget) return;
  const t      = i18n[lang];
  const submit = document.getElementById('jumlahSubmitBtn');
  const skip   = document.getElementById('jumlahSkipBtn');
  submit.textContent = '⏳';
  submit.disabled = true;
  skip.style.display = 'none';
  jsonp(
    `${APPS_SCRIPT_URL}?action=rekodJumlah&sheet=${encodeURIComponent(_jumlahTarget.sheet)}&row=${_jumlahTarget.row}&jumlah=${_jumlahVal}&ic=${encodeURIComponent(_jumlahTarget.ic)}`,
    (err, res) => {
      const resultEl = document.getElementById('jumlahResult');
      resultEl.style.display = 'block';
      if (err || !res) {
        resultEl.className   = 'jumlah-result err';
        resultEl.textContent = t.jumlahErr;
        submit.disabled = false;
        submit.textContent = t.jumlahHantar;
        return;
      }
      resultEl.className   = res.success ? 'jumlah-result ok' : 'jumlah-result err';
      resultEl.textContent = res.success ? t.jumlahOk : (res.message || t.jumlahErr);
      submit.style.display = 'none';
      if (res.success) {
        setTimeout(() => closeJumlah(), 2000);
      } else {
        submit.disabled = false;
        submit.textContent = t.jumlahHantar;
        skip.style.display = 'block';
      }
    }
  );
}
</script>



<!-- ══ JUMLAH INDIVIDU MODAL ══ -->
<div class="modal-overlay" id="jumlahModal" style="display:none;">
  <div class="jumlah-modal-box">
    <div class="jumlah-icon-big">👨‍👩‍👧‍👦</div>
    <div class="jumlah-title" id="jumlahTitle">Berapa orang hadir bersama?</div>
    <div class="jumlah-sub" id="jumlahSub">(Termasuk diri sendiri)</div>
    <div class="jumlah-counter">
      <button class="jcnt-btn" id="jMinus" onclick="jumlahAdj(-1)" disabled>−</button>
      <div class="jcnt-num" id="jumlahNum">0</div>
      <button class="jcnt-btn" id="jPlus" onclick="jumlahAdj(1)">+</button>
    </div>
    <div class="jumlah-dots" id="jumlahDots"></div>
    <button class="jumlah-submit" onclick="submitJumlah()" id="jumlahSubmitBtn">✓ Hantar</button>
    <button class="jumlah-skip" onclick="skipJumlah()" id="jumlahSkipBtn">Langkau</button>
    <div class="jumlah-result" id="jumlahResult" style="display:none;"></div>
  </div>
</div>

<!-- ══ CONFIRM TERIMA BANTUAN MODAL ══ -->
<div class="modal-overlay" id="terimaConfirmModal" style="display:none;">
  <div class="confirm-box">
    <div class="confirm-icon">🎁</div>
    <div class="confirm-title" id="terimaQTitle">Adakah anda telah terima bantuan?</div>
    <div class="confirm-sub" id="terimaQSub"></div>
    <div class="confirm-btns" id="terimaQBtns">
      <button class="confirm-tidak" onclick="closeTerimaConfirm()" id="terimaQTidak">Tidak</button>
      <button class="confirm-ya" onclick="submitTerimaConfirm()" id="terimaQYa">✓ Ya, Telah Terima</button>
    </div>
    <div class="confirm-result" id="terimaQResult" style="display:none;"></div>
  </div>
</div>

</body>
